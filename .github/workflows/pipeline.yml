name: Pipeline veille BOAMP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # 6h UTC = 8h Paris en été, 7h en hiver

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Mettre en cache le modèle Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modele-sentence-transformers-v1

      - name: Lancer la pipeline (collecte + tags + scores + analyse LLM)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/main.py