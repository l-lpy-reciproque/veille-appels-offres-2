name: Publication de la page web

# Publie le dossier web/ sur GitHub Pages à chaque modification poussée sur main.
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le contenu
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
